name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: expense_manager
          MYSQL_USER: expense_user
          MYSQL_PASSWORD: expense_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, zip

      - name: Instala dependencias
        run: composer install --optimize-autoloader --no-interaction

      - name: Configura variaveis de ambiente
        run: |
          {
            echo "YII_ENV=test"
            echo "YII_DEBUG=true"
            echo "APP_PORT=8080"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=expense_manager"
            echo "DB_USERNAME=expense_user"
            echo "DB_PASSWORD=expense_password"
            echo "DB_ROOT_PASSWORD=root_password"
            echo "JWT_SECRET=chave-secreta-jwt-com-pelo-menos-32-caracteres"
            echo "COOKIE_VALIDATION_KEY=chave-secreta-cookie"
          } | tee -a .env >> "$GITHUB_ENV"

      - name: Aguarda o banco de dados
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u expense_user -pexpense_password && break
            sleep 2
          done

      - name: Roda migrations
        run: php yii migrate --interactive=0

      - name: Roda seed
        run: php yii seed

      - name: Gera classes do Codeception
        run: vendor/bin/codecept build

      - name: Roda testes
        run: vendor/bin/codecept run Functional
